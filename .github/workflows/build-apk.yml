
name: Generar APK SanTV

on:
  workflow_dispatch:
  push:
    paths:
      - 'SanTV-AndroidTV-y-movil.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir SanTV
        run: unzip -o SanTV-AndroidTV-y-movil.zip -d .

      - name: Compilar aplicación
        run: gradle -p SanTV-AndroidTV assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SanTV-APK
          path: SanTV-AndroidTV/app/build/outputs/apk/debug/app-debug.apk
